<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ee">
<meta name="format-detection" content="telephone=no">
<title>川崎礼盒图册</title>
<style>
:root {
    --bg: #f5f2ee;
    --card-bg: #fff;
    --img-bg: #f0ece8;
    --text: #2c3e50;
    --text-sub: #7f8c8d;
    --accent: #e67e22;
    --radius: 16px;
    --gap: 25px;
    --card-min: 220px;
    --img-h: 210px;
    --page-pad: 30px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: var(--page-pad);
    padding-bottom: calc(var(--page-pad) + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

h1 { text-align: center; font-size: 2.8rem; margin-bottom: 10px; letter-spacing: 4px; }
.sub { text-align: center; color: var(--text-sub); margin-bottom: 40px; }

.series { margin-bottom: 50px; }
.series-title {
    font-size: 1.8rem; font-weight: 600;
    border-left: 8px solid var(--accent);
    padding-left: 20px; margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
    gap: var(--gap);
}

.card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
}

@media (hover: hover) and (pointer: fine) {
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(0,0,0,0.15); }
}

.card .thumb {
    position: relative;
    width: 100%;
    height: var(--img-h);
    background: var(--img-bg);
    overflow: hidden;
}

.card img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease;
}
.card img.loaded { opacity: 1; }

.thumb.shimmer::before {
    content: '';
    position: absolute; inset: 0;
    z-index: 2;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
    animation: shimmer 1.4s infinite;
    pointer-events: none;
}
@keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.no-img {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    color: #b0a9a2; font-size: 0.9rem;
}

.card .name {
    padding: 12px 14px;
    font-size: 0.95rem;
    font-weight: 500;
    text-align: center;
    color: #34495e;
    border-top: 1px solid var(--img-bg);
    line-height: 1.4;
    word-break: break-word;
}

.tip { text-align: center; padding: 60px 20px; color: #95a5a6; line-height: 1.9; }
.tip small { color: #bdc3c7; }

footer { text-align: center; margin-top: 50px; color: #bdc3c7; font-size: 0.9rem; }

@media (max-width: 640px) {
    :root {
        --page-pad: 14px;
        --gap: 12px;
        --card-min: 140px;
        --img-h: 150px;
        --radius: 12px;
    }
    h1 { font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 6px; }
    .sub { font-size: 0.85rem; margin-bottom: 24px; }
    .series { margin-bottom: 32px; }
    .series-title {
        font-size: 1.15rem;
        border-left-width: 5px;
        padding-left: 12px;
        margin-bottom: 14px;
    }
    .card .name { padding: 8px 8px; font-size: 0.78rem; }
    .no-img { font-size: 0.75rem; }
    footer { font-size: 0.78rem; margin-top: 30px; }
}

@media (max-width: 360px) {
    :root { --card-min: 120px; --img-h: 130px; --gap: 10px; }
}

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .card img { opacity: 1; }
    .thumb.shimmer::before { display: none; }
}
</style>
</head>
<body>
    <h1>🏸 川崎礼盒 · 图册</h1>
    <p class="sub" id="sub">加载中…</p>
    <main id="gallery"></main>
    <footer>图片存放于 images/ 目录，上传后自动更新</footer>

<script>
/* ==================== 配置 ==================== */
const OWNER  = 'xiejy0';
const REPO   = 'lihe';
const BRANCH = 'main';
/* ============================================== */

const DIR = 'images';

const USE_CDN = true;

const CACHE_TTL = 5 * 60 * 1000;

const PRELOAD_MARGIN = '400px 0px';

const FRAME_BUDGET_MS = 8;

const SERIES = [
    { id: 'aurora',     title: '⚡ 极光系列' },
    { id: 'bluebird',   title: '🐦 青鸟系列' },
    { id: 'rebar',      title: '🔩 螺纹钢系列' },
    { id: 'dingfengbo', title: '🎋 国风系列' },
    { id: 'art',        title: '🎨 艺术·联名·限定' },
    { id: 'xingzuo',    title: '＆ 12星座系列' },
    { id: 'other',      title: '🎁 其他主题礼盒' },
];

const RULES = [
    { id: 'xingzuo',    re: /星座|白羊|金牛|双子|巨蟹|狮子|处女|天秤|天蝎|射手|摩羯|水瓶|双鱼/ },
    { id: 'aurora',     re: /极光/ },
    { id: 'bluebird',   re: /青鸟/ },
    { id: 'rebar',      re: /螺纹钢/ },
    { id: 'dingfengbo', re: /定风波|赤壁赋|金榜题名|竹影|凤栖/ },
    { id: 'art',        re: /莫奈|梵高|达芬奇|星月夜|麦田|睡莲|鸢尾|向日葵|岩间圣母|丝柏|联名/ },
];

const OVERRIDE = {
    // '川崎礼盒-梧桐-凤栖礼盒01': 'other',
};

function guessSeries(name) {
    if (OVERRIDE[name]) return OVERRIDE[name];
    for (const r of RULES) if (r.re.test(name)) return r.id;
    return 'other';
}

const CACHE_KEY = 'kawasaki-gallery-v2';

function readCache() {
    try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const { t, data } = JSON.parse(raw);
        return Date.now() - t > CACHE_TTL ? null : data;
    } catch { return null; }
}
function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch {}
}

function buildUrls(file) {
    const enc = encodeURIComponent(file);
    const raw = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${DIR}/${enc}`;
    if (!USE_CDN) return { url: raw, fallback: '' };
    const cdn = `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/${DIR}/${enc}`;
    return { url: cdn, fallback: raw };
}

async function fetchList() {
    const cached = readCache();
    if (cached) return cached;

    const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?ref=${BRANCH}&t=${Date.now()}`;
    const res = await fetch(api, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(data.message || '返回格式异常');

    const list = data
        .filter(f => f.type === 'file' && /\.(png|jpe?g|webp|gif|avif)$/i.test(f.name))
        .map(f => {
            const name = f.name.replace(/\.[^.]+$/, '');
            const { url, fallback } = buildUrls(f.name);
            return { file: f.name, name, url, fallback, series: guessSeries(name) };
        })
        .sort((a, b) => a.name.localeCompare(b.name, 'zh'));

    writeCache(list);
    return list;
}

let io = null;

function getObserver() {
    if (io) return io;
    io = new IntersectionObserver(entries => {
        for (const e of entries) {
            if (!e.isIntersecting) continue;
            io.unobserve(e.target);
            startLoad(e.target);
        }
    }, {
        root: null,
        rootMargin: PRELOAD_MARGIN,
        threshold: 0.01,
    });
    return io;
}

function startLoad(img) {
    const primary  = img.dataset.src;
    const fallback = img.dataset.fallback;
    if (!primary) return;
    delete img.dataset.src;

    img.onload = () => {
        img.classList.add('loaded');
        const wrap = img.parentElement;
        if (wrap) wrap.classList.remove('shimmer');
    };

    img.onerror = () => {
        if (fallback && img.dataset.tried !== '1') {
            img.dataset.tried = '1';
            img.src = fallback;
            return;
        }
        const wrap = img.parentElement;
        if (wrap) {
            wrap.classList.remove('shimmer');
            const ph = wrap.querySelector('.no-img');
            if (ph) ph.style.display = 'flex';
        }
        img.remove();
    };

    img.src = primary;
}

function buildSkeleton() {
    const gallery = document.getElementById('gallery');
    const frag = document.createDocumentFragment();

    for (const s of SERIES) {
        const sec = document.createElement('section');
        sec.className = 'series';
        sec.dataset.series = s.id;

        const title = document.createElement('div');
        title.className = 'series-title';
        title.textContent = s.title;

        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.id = 'grid-' + s.id;

        sec.append(title, grid);
        frag.appendChild(sec);
    }
    gallery.appendChild(frag);
}

function makeCard(item) {
    const card = document.createElement('article');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb shimmer';

    const img = document.createElement('img');
    img.alt = item.name;
    img.decoding = 'async';
    img.dataset.src = item.url;
    if (item.fallback) img.dataset.fallback = item.fallback;

    const ph = document.createElement('div');
    ph.className = 'no-img';
    ph.textContent = '🖼️ 图片缺失';

    thumb.append(img, ph);

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = item.name;

    card.append(thumb, nameEl);
    return card;
}

function render(list) {
    const grouped = new Map(SERIES.map(s => [s.id, []]));
    for (const item of list) {
        if (!grouped.has(item.series)) grouped.set(item.series, []);
        grouped.get(item.series).push(item);
    }

    const jobs = [];
    let total = 0;

    for (const s of SERIES) {
        const grid = document.getElementById('grid-' + s.id);
        const section = grid.closest('.series');
        const items = grouped.get(s.id) || [];

        if (!items.length) { section.style.display = 'none'; continue; }

        total += items.length;
        for (const item of items) {
            jobs.push({ parent: grid, node: makeCard(item) });
        }
    }

    document.getElementById('sub').textContent = `全系列礼盒一览（共 ${total} 款）`;

    const observer = getObserver();
    let i = 0;

    function flush() {
        const t0 = performance.now();
        while (i < jobs.length && performance.now() - t0 < FRAME_BUDGET_MS) {
            const { parent, node } = jobs[i++];
            parent.appendChild(node);
            const img = node.querySelector('img[data-src]');
            if (img) observer.observe(img);
        }
        if (i < jobs.length) requestAnimationFrame(flush);
    }

    requestAnimationFrame(flush);
}

function showError(msg) {
    document.getElementById('sub').textContent = '加载失败';
    const box = document.createElement('div');
    box.className = 'tip';
    box.innerHTML = `😕 无法读取图片列表<br><small>${msg}</small><br><br>
        请检查：仓库是否为 Public、OWNER / REPO 是否填对、images 文件夹是否存在<br>
        <small>（用 file:// 直接打开本地文件无法访问 API，需部署到 GitHub Pages）</small>`;
    document.getElementById('gallery').appendChild(box);
}

buildSkeleton();
fetchList().then(render).catch(e => showError(e.message));
</script>
</body>
</html>
