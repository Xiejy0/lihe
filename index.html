<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>川崎礼盒图册</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f5f2ee; padding: 30px; }
    h1 { text-align: center; font-size: 2.8rem; color: #2c3e50; margin-bottom: 10px; letter-spacing: 4px; }
    .sub { text-align: center; color: #7f8c8d; margin-bottom: 40px; }
    .series { margin-bottom: 50px; }
    .series-title { font-size: 1.8rem; font-weight: 600; border-left: 8px solid #e67e22; padding-left: 20px; margin-bottom: 25px; color: #2c3e50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); overflow: hidden; transition: transform 0.2s; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(0,0,0,0.15); }
    .card img { width: 100%; height: 210px; object-fit: contain; display: block; background: #f0ece8; }
    .card .name { padding: 12px 14px; font-size: 0.95rem; font-weight: 500; text-align: center; color: #34495e; border-top: 1px solid #f0ece8; }
    .no-img { display: flex; align-items: center; justify-content: center; height: 210px; background: #f0ece8; color: #b0a9a2; font-size: 0.9rem; }
    .tip { text-align: center; padding: 60px 20px; color: #95a5a6; }
    footer { text-align: center; margin-top: 50px; color: #bdc3c7; font-size: 0.9rem; }
</style>
</head>
<body>
    <h1>🏸 川崎礼盒 · 图册</h1>
    <p class="sub" id="sub">加载中…</p>
    <main id="gallery"></main>
    <footer>图片存放于 images/ 目录，上传后自动更新</footer>

<script>
/* ========== 只改这两行 ========== */
const OWNER = 'Xiejy0';
const REPO  = 'lihe';
/* =============================== */

const DIR = 'images';

/* 系列定义：id 用于自动分类，title 是显示标题 */
const SERIES = [
    { id: 'aurora',     title: '⚡ 极光系列' },
    { id: 'bluebird',   title: '🐦 青鸟系列' },
    { id: 'rebar',      title: '🔩 螺纹钢系列' },
    { id: 'dingfengbo', title: '🎋 国风系列' },
    { id: 'art',        title: '🎨 艺术·联名·限定' },
    { id: 'xingzuo',    title: '＆ 12星座系列' },
    { id: 'other',      title: '🎁 其他主题礼盒' },
];

/* 自动分类规则：从上往下匹配，命中即停。想调整归类就改这里 */
const RULES = [
    { id: 'xingzuo',    re: /星座|白羊|金牛|双子|巨蟹|狮子|处女|天秤|天蝎|射手|摩羯|水瓶|双鱼/ },
    { id: 'aurora',     re: /极光/ },
    { id: 'bluebird',   re: /青鸟/ },
    { id: 'rebar',      re: /螺纹钢/ },
    { id: 'dingfengbo', re: /定风波|赤壁赋|金榜题名|竹影|凤栖/ },
    { id: 'art',        re: /莫奈|梵高|达芬奇|星月夜|麦田|睡莲|鸢尾|向日葵|岩间圣母|丝柏|联名/ },
];

/* 手动指定某张图属于哪个系列（可选）。键是去掉扩展名的文件名 */
const OVERRIDE = {
    // '川崎礼盒-梧桐-凤栖礼盒01': 'other',
};

function guessSeries(name) {
    if (OVERRIDE[name]) return OVERRIDE[name];
    for (const r of RULES) if (r.re.test(name)) return r.id;
    return 'other';
}

/* ---------- 缓存（5分钟，减少 API 请求） ---------- */
const CACHE_KEY = 'kawasaki-gallery-v1';
const CACHE_TTL = 5 * 60 * 1000;

function readCache() {
    try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const { t, data } = JSON.parse(raw);
        return Date.now() - t > CACHE_TTL ? null : data;
    } catch { return null; }
}
function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch {}
}

/* ---------- 拉取图片列表 ---------- */
async function fetchList() {
    const cached = readCache();
    if (cached) return cached;

    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?ref=main&t=${Date.now()}`;
    const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(data.message || '返回格式异常');

    const list = data
        .filter(f => f.type === 'file' && /\.(png|jpe?g|webp|gif|avif)$/i.test(f.name))
        .map(f => ({
            file: f.name,
            url: f.download_url,
            name: f.name.replace(/\.[^.]+$/, ''),
        }));

    writeCache(list);
    return list;
}

/* ---------- 渲染 ---------- */
function buildSkeleton() {
    const gallery = document.getElementById('gallery');
    SERIES.forEach(s => {
        const sec = document.createElement('div');
        sec.className = 'series';
        sec.dataset.series = s.id;

        const title = document.createElement('div');
        title.className = 'series-title';
        title.textContent = s.title;

        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.id = 'grid-' + s.id;

        sec.append(title, grid);
        gallery.appendChild(sec);
    });
}

function makeCard(item) {
    const card = document.createElement('div');
    card.className = 'card';

    const ph = document.createElement('div');
    ph.className = 'no-img';
    ph.style.display = 'none';
    ph.textContent = '🖼️ 图片缺失';

    const img = document.createElement('img');
    img.alt = item.name;
    img.loading = 'lazy';
    img.src = item.url;
    img.onerror = () => { img.style.display = 'none'; ph.style.display = 'flex'; };

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = item.name;

    card.append(img, ph, nameEl);
    return card;
}

function render(list) {
    const withSeries = list.map(x => ({ ...x, series: guessSeries(x.name) }));
    let total = 0;

    SERIES.forEach(s => {
        const grid = document.getElementById('grid-' + s.id);
        const section = grid.closest('.series');
        const items = withSeries
            .filter(x => x.series === s.id)
            .sort((a, b) => a.name.localeCompare(b.name, 'zh'));

        if (!items.length) { section.style.display = 'none'; return; }
        total += items.length;
        items.forEach(x => grid.appendChild(makeCard(x)));
    });

    document.getElementById('sub').textContent = `全系列礼盒一览（共 ${total} 款）`;
}

function showError(msg) {
    document.getElementById('sub').textContent = '加载失败';
    const box = document.createElement('div');
    box.className = 'tip';
    box.innerHTML = `😕 无法读取图片列表<br><small>${msg}</small><br><br>
        请检查：仓库是否 Public、${OWNER}/${REPO} 是否填对、images 文件夹是否存在`;
    document.getElementById('gallery').appendChild(box);
}

/* ---------- 启动 ---------- */
buildSkeleton();
fetchList().then(render).catch(e => showError(e.message));
</script>
</body>
</html>
